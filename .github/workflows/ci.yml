name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every PR is gated on Linux. macOS and Windows run together on main (and on
# demand): the Windows runner's git-heavy publish/sync tests drift past the
# 5s test timeout on a slow day, and a one-line PR should not wait on that.
# The publish workflow re-verifies the package on release. The focused Windows
# exit job also runs on every PR: Node 22 cannot detect the Node 24.19.0 race.
jobs:
  build:
    name: Typecheck, test, bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      # Public IdeaSpaces dependencies are git-pinned, but package-lock records
      # GitHub SSH URLs and the CI runner has no SSH key. Rewrite them to
      # anonymous HTTPS; no token is needed.
      - name: Force HTTPS for GitHub git fetch
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --maxWorkers=1 --no-file-parallelism

      - name: Build and verify the publishable package
        run: npm run check:package

  windows-exit:
    name: Windows command exit (Node 24.19.0)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: "npm"
      - name: Force HTTPS for GitHub git fetch
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install and build
        run: npm ci
      - name: Verify real subprocess exit and resource cleanup
        run: npm test -- src/test/cli-exit.test.ts src/test/cli-exit-lifecycle.test.ts --maxWorkers=1 --no-file-parallelism
