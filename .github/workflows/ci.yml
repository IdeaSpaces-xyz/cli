name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep the existing required Linux/Windows status names and SLC gate. Windows
# executes the entire suite across two native shards, each serial internally.
# The required Windows status fails unless BOTH shards, including their package
# verification, succeed. No timeout increase, platform skip or test is removed.
jobs:
  build:
    name: Typecheck, test, bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Force HTTPS for GitHub git fetch
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --maxWorkers=1 --no-file-parallelism
      - name: Build and verify the publishable package
        run: npm run check:package

  windows:
    name: Windows test shard (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Force HTTPS for GitHub git fetch
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --maxWorkers=1 --no-file-parallelism --shard=${{ matrix.shard }}/2
      - name: Build and verify the publishable package
        run: npm run check:package

  windows-gate:
    name: Typecheck, test, bundle (windows-latest)
    needs: [windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every Windows shard and its package proof
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: node -e "if (process.env.WINDOWS_RESULT !== 'success') process.exit(1)"
