name: Current command exit proof (diagnostic only)

on:
  workflow_dispatch:

jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: "npm"
      - name: Force HTTPS for GitHub git fetch
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install and build candidate
        run: npm ci
      - name: Verify candidate subprocess lifecycle
        run: npm test -- src/test/cli-exit.test.ts src/test/cli-exit-lifecycle.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Download released v0.7.0 MCP bundle
        shell: bash
        run: |
          mkdir -p .exit-proof
          curl --fail --location --output .exit-proof/mcp.mjs https://raw.githubusercontent.com/IdeaSpaces-xyz/claude-code-plugin/v0.7.0/dist/index.js
      - name: Verify packaged MCP with candidate CLI
        run: node scripts/current-exit-mcp-proof.mjs
      - name: Restore only forced exits for a negative control
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'src/main.ts', source = readFileSync(file, 'utf8');
          if (source.split('process.exitCode = exitCode;').length !== 3) throw Error('Expected exactly two exit sites');
          writeFileSync(file, source.replaceAll('process.exitCode = exitCode;', 'process.exit(exitCode);'));
          JS
          npm run build
      - name: Run forced-exit control with literal loopback IP
        id: forced-ip
        continue-on-error: true
        run: |
          npm test -- src/test/cli-exit.test.ts src/test/cli-exit-lifecycle.test.ts --maxWorkers=1 --no-file-parallelism *> .exit-proof/forced-ip.log
          exit $LASTEXITCODE
      - name: Enable loopback DNS for the second negative control
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'src/test/cli-exit.test.ts', source = readFileSync(file, 'utf8');
          writeFileSync(file, source.replace('http://127.0.0.1:${address.port}', 'http://localhost:${address.port}').replace('https://127.0.0.1:${secure.port}', 'https://localhost:${secure.port}'));
          JS
      - name: Run forced-exit control with loopback DNS
        id: forced-dns
        continue-on-error: true
        run: |
          npm test -- src/test/cli-exit.test.ts --maxWorkers=1 --no-file-parallelism *> .exit-proof/forced-dns.log
          exit $LASTEXITCODE
      - name: Record negative control outcomes without treating them as candidate failures
        shell: bash
        run: |
          printf '{"literalIp":"%s","loopbackDns":"%s"}\n' '${{ steps.forced-ip.outcome }}' '${{ steps.forced-dns.outcome }}' | tee .exit-proof/control-outcomes.json
      - name: Retain raw proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-command-exit-proof
          path: .exit-proof
          include-hidden-files: true
          if-no-files-found: error
