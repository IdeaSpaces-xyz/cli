name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linux and Windows run for every PR and queue group. macOS joins them on main
# and on demand. Keep the Windows status check required alongside Linux/SLC in
# branch protection, so a failure cannot silently drift past the merge queue.
# The publish workflow re-verifies the package on release.
jobs:
  build:
    name: Typecheck, test, bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      # Public IdeaSpaces dependencies are git-pinned, but package-lock records
      # GitHub SSH URLs and the CI runner has no SSH key. Rewrite them to
      # anonymous HTTPS; no token is needed.
      - name: Force HTTPS for GitHub git fetch
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --maxWorkers=1 --no-file-parallelism

      - name: Build and verify the publishable package
        run: npm run check:package
