name: SLC Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  # No job-level `if`: a skipped job reports success on a required check. Every PR reaches the gate.
  slc-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        if: ${{ !github.event.pull_request.draft }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run SLC Review
        id: review
        if: ${{ !github.event.pull_request.draft }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request using our SLC (Simple, Lovable, Complete) principles for the IdeaSpaces CLI.

            ## Context
            - This repo: TypeScript Node CLI (`@ideaspaces/cli`). It bundles via esbuild and is distributed both directly and inside agent integrations.
            - Architecture boundary: `@ideaspaces/protocol` owns portable, platform-neutral knowledge-repo shape and read-only reference primitives; `@ideaspaces/sdk` owns platform transport contracts; the CLI owns command orchestration, presentation, auth/sync, and local write workflows.
            - Thin CLI means reusing the owning layer directly: shape imports come from the protocol, platform transport imports come from the SDK, and CLI-local code should be limited to harness/client behavior.
            - Preserve local-first safety: explicit capture/commit scope, no surprise writes, and no network access in local shape reads.
            - One decided exception to that rule (#279, the human, 2026-11-04): the daily update check. It is on by default. At most once a day, for a person at a terminal on a global install, a detached process makes one GET to `https://registry.npmjs.org/@ideaspaces/cli/latest`, with no redirects, and `~/.ideaspaces/update-check.json` records the time and the version. It sends nothing about anyone's work. `IDEASPACES_NO_UPDATE_CHECK` and `NO_UPDATE_NOTIFIER` turn it off. It is silent in CI, in host mode and in agent sessions it can detect. Its notice is one line on stderr, never with `--json`. `status doctor` and the out-of-date message may show the validated version the last check stored, and make no call of their own. Do not flag this behaviour. Flag anything that widens it: another host, a redirect, more data sent, more than one lookup a day, a weaker opt-out, a wider audience, a synchronous call, a live lookup on any other path, the notice reaching stdout or `--json`, or anything done with the answer beyond storing and showing a validated version. Integrator owns this exception, and any widening reopens it.

            ## SLC label context
            - `slc:simple` / `slc:lovable` / `slc:complete`: quick validation for labeled dimensions, deeper review for unlabeled.
            - `needs:slc-review`: do deeper analysis.
            - No SLC labels: standard full review.

            ## SLC Framework Review

            ### Simple 🎯
            - Is this the simplest implementation that solves the user problem?
            - Does it reuse existing patterns and the owning layer directly (protocol shape primitives, SDK platform transport, CLI output/argv/auth helpers)?
            - Any unnecessary new abstractions or framework-like complexity?
            - Avoidable code paths that should sit in the protocol or SDK, according to the boundary above, or be deferred?

            ### Lovable ❤️
            - CLI UX: clear `--help`, sensible defaults, plan-then-confirm for destructive ops, useful error messages with hints.
            - Output discipline: human text on stderr, JSON on stdout when `--json` is set; no broken JSON contract.
            - Failure modes: errors actionable, exit codes consistent with errors.ts conventions.
            - Discoverability: examples in CommandDef, names match user mental models.

            ### Complete 🏁
            - Error handling covers unhappy paths (missing flags, file conflicts, git failures, auth issues)?
            - Tests cover the new behavior (vitest under src/test/) including edge cases?
            - No leftover references to stripped commands or stripped SDK exports?
            - Bundle still works end-to-end (`node bundle/ideaspaces.js --help` succeeds in CI)?

            ## CLI-specific checks
            - Replace-semantics for write operations (caller specifies all fields; no surprise merges).
            - File-system safety: never overwrite without explicit `--force` or equivalent confirmation.
            - Git operations: shell out via `child_process` (no extra deps), graceful degradation when git isn't available or repo state is unexpected.
            - No hardcoded API URLs / credentials. Auth via `auth/credentials.ts` only.
            - `--yes` flag honored for non-interactive automation paths.

            ## Anti-pattern detection 🚨
            - Over-engineering or speculative infrastructure.
            - Scope creep beyond PR description.
            - Reintroducing server-flavored complexity (the strip is intentional).
            - Incomplete features (missing error/loading handling, no fallback behavior).

            ## Output format

            **SLC Assessment:**
            - ✅/⚠️/❌ Simple: [brief assessment]
            - ✅/⚠️/❌ Lovable: [brief assessment]
            - ✅/⚠️/❌ Complete: [brief assessment]

            **Anti-Patterns Found:** [list or "None detected"]

            **CLI-Specific Issues:** [list or "None detected"]

            **Detailed Feedback:** [specific issues and suggestions]

            **Recommendation:** Approve / Request Changes / Comment

            Use `gh pr comment` to post your review.

            ## Verdict

            After posting, return your recommendation as the structured `verdict`. It is what passes or fails this required check, and it must match the Recommendation in your comment.
            - `approve`: nothing needs to change.
            - `comment`: notes worth reading, and no blocker.
            - `request_changes`: something must change before merge. If you would write "resolve before merge" or set a condition on approving, this is the verdict.

          claude_args: |
            --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","comment","request_changes"]}},"required":["verdict"],"additionalProperties":false}'

      # Inline on purpose: a script from the checkout could be edited by the PR it judges.
      # No valid verdict is a failure, so a review that skipped, crashed or never ran cannot pass.
      - name: Gate on the verdict
        if: always()
        env:
          REVIEW_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: |
          verdict=$(printf '%s' "$REVIEW_OUTPUT" | jq -r 'if type == "object" then .verdict // "" else "" end' 2>/dev/null || true)
          case "$verdict" in
            approve|comment)
              echo "SLC verdict for this head: $verdict"
              ;;
            request_changes)
              echo "::error title=SLC review requested changes::The review of this head asks for changes. Read its comment, fix them and push."
              exit 1
              ;;
            *)
              echo "::error title=SLC review did not run::No verdict for this head, so this PR has not been reviewed. A draft is not reviewed until it is ready. A PR that edits this workflow skips its own review and stays red until an independent review and a knowing merge. Otherwise, read the review step and re-run it."
              exit 1
              ;;
          esac
