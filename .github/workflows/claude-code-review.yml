name: SLC Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  # No job-level `if`: a skipped job reports success on a required check. Every PR reaches the gate.
  slc-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        if: ${{ !github.event.pull_request.draft }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Nothing here
        run: echo no review, no gate
